site:
  name: Practical Algorithm
  site: 'https://practicalalgorithm.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Practical Algorithm
    template: '%s — Practical Algorithm'
  description: 'Practical Algorithm, Inc. is a Registered Salesforce Partner designing, architecting, and implementing practical Salesforce solutions.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Practical Algorithm
    images:
      - url: '~/assets/images/banner/whiteboard.jpg'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
